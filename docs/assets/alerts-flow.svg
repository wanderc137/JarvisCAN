<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de alertas de JarvisCAN</title>
  <desc id="desc">Seis reglas evaluadas por un scheduler, síntesis de voz Piper, archivos WAV y JSONL, panel web y reproducción en el navegador.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <style>
      .title{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f8fafc}
      .sub{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .lbl{font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#e2e8f0}
      .small{font:400 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .tiny{font:500 10px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#64748b}
      .cyan{font:700 11px system-ui,sans-serif;fill:#22d3ee;letter-spacing:.08em}
      .mono{font:600 11.5px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
      .val{font:700 11px ui-monospace,Menlo,monospace;fill:#fbbf24}
      .rule{fill:#101d31;stroke:#2b4a6f;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="48" y="58" class="title">De una muestra a una alerta hablada</text>
  <text x="48" y="82" class="sub">Seis reglas, un scheduler escalonado y audio reproducible en el navegador</text>

  <!-- Rules panel -->
  <rect x="40" y="112" width="430" height="596" rx="18" fill="#0b1220" stroke="#1e293b"/>
  <text x="60" y="142" class="cyan">REGLAS · ÚLTIMAS 20 MUESTRAS</text>

  <rect x="58" y="158" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="180" r="5" fill="#f87171"/>
  <text x="90" y="184" class="mono">engine_temp</text>
  <text x="76" y="204" class="small">≥ 105 °C o +15 °C sobre la media móvil</text>
  <text x="76" y="222" class="tiny">temperatura riesgosa · media previa</text>

  <rect x="58" y="244" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="266" r="5" fill="#38bdf8"/>
  <text x="90" y="270" class="mono">coolant_level</text>
  <text x="76" y="290" class="small">≤ 60 % del depósito</text>
  <text x="76" y="308" class="tiny">nivel bajo de refrigerante</text>

  <rect x="58" y="330" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="352" r="5" fill="#fbbf24"/>
  <text x="90" y="356" class="mono">tire_pressure</text>
  <text x="76" y="376" class="small">≤ 180 kPa o ≤ 75 % de la media</text>
  <text x="76" y="394" class="tiny">posición DI · DD · TI · TD</text>

  <rect x="58" y="416" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="438" r="5" fill="#a78bfa"/>
  <text x="90" y="442" class="mono">oil_level</text>
  <text x="76" y="462" class="small">≤ 60 %</text>
  <text x="76" y="480" class="tiny">nivel de aceite riesgoso</text>

  <rect x="58" y="502" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="524" r="5" fill="#f472b6"/>
  <text x="90" y="528" class="mono">dtc</text>
  <text x="76" y="548" class="small">códigos o avisos nuevos en 20 muestras</text>
  <text x="76" y="566" class="tiny">P0128 · P0300 · P0171 · P0420 · C0035 · U0100</text>

  <rect x="58" y="588" width="394" height="76" class="rule" rx="10"/>
  <circle cx="76" cy="610" r="5" fill="#34d399"/>
  <text x="90" y="614" class="mono">overspeed</text>
  <text x="76" y="634" class="small">&gt; 130 km/h, solo en el flanco de subida</text>
  <text x="76" y="652" class="tiny">flag overspeed_active evita repeticiones</text>

  <text x="58" y="690" class="tiny">Umbrales de demostración; se calibran con datos reales.</text>

  <!-- Scheduler -->
  <rect x="510" y="170" width="240" height="190" rx="16" fill="#101d31" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="530" y="198" class="cyan">SCHEDULER</text>
  <text x="530" y="222" class="lbl">can_alerts.py</text>
  <text x="530" y="246" class="small">next_due por regla</text>
  <text x="530" y="266" class="small">desfase inicial: 0–25 min</text>
  <text x="530" y="286" class="small">revisión: cada 3 min</text>
  <text x="530" y="306" class="small">sueño en trozos ≤ 5 s</text>
  <text x="530" y="330" class="tiny">guarda estado tras cada regla</text>
  <rect x="650" y="178" width="88" height="20" rx="10" fill="#22d3ee"/>
  <text x="662" y="192" font-family="Menlo,monospace" font-size="10" font-weight="700" fill="#04121f">180 s</text>

  <!-- DB -->
  <rect x="510" y="400" width="240" height="96" rx="14" fill="#0e2a33" stroke="#0e7490"/>
  <text x="530" y="426" class="mono">SQLite · mode=ro</text>
  <text x="530" y="448" class="small">últimas 20 muestras</text>
  <text x="530" y="466" class="small">introspección de columnas</text>
  <text x="530" y="484" class="tiny">si el simulador se detiene, repite la última</text>

  <path d="M630 400 L630 364" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Piper -->
  <rect x="820" y="150" width="310" height="130" rx="16" fill="#1a1430" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="840" y="178" class="cyan">VOZ</text>
  <text x="840" y="204" class="lbl">Piper · es_MX-claude-high</text>
  <text x="840" y="226" class="small">perfil human-lite · 0.45 s entre frases</text>
  <text x="840" y="246" class="small">fallback: espeak-ng</text>
  <text x="840" y="264" class="tiny">~8–9 s de CPU por ~8 s de audio</text>

  <path d="M750 240 C780 240 790 220 816 214" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Files -->
  <rect x="820" y="330" width="310" height="140" rx="16" fill="#101d31" stroke="#2b4a6f"/>
  <text x="840" y="358" class="cyan">ARCHIVOS</text>
  <text x="840" y="382" class="mono">data/last_answer.wav</text>
  <text x="840" y="404" class="small">copia → alert_audio/alert_&lt;ts&gt;_&lt;regla&gt;.wav</text>
  <text x="840" y="424" class="small">data/alerts.jsonl · alerts.log</text>
  <text x="840" y="444" class="small">data/alerts_state.json</text>
  <text x="840" y="462" class="tiny">poda: últimos 200 audios</text>

  <path d="M900 280 L900 326" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arA)"/>
  <text x="908" y="308" class="tiny">WAV + metadatos</text>

  <!-- Panel -->
  <rect x="820" y="520" width="310" height="120" rx="16" fill="#101d31" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="840" y="548" class="cyan">PANEL · :8090</text>
  <text x="840" y="572" class="mono">tts-server.py</text>
  <text x="840" y="594" class="small">lee alerts.jsonl y resuelve audio_url</text>
  <text x="840" y="612" class="small">/api/alerts · /healthz · /alert-audio</text>
  <text x="840" y="630" class="tiny">monitor_active = PID vivo</text>

  <path d="M975 470 L975 516" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="983" y="498" class="tiny">JSONL + WAV</text>

  <!-- Browser -->
  <rect x="820" y="684" width="310" height="70" rx="14" fill="#0b2233" stroke="#164e63"/>
  <text x="840" y="710" class="lbl">Navegador LAN</text>
  <text x="840" y="730" class="small">feed · tarjetas · reproducción del WAV</text>

  <path d="M975 640 L975 680" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="983" y="664" class="tiny">HTTP</text>

  <!-- Flow labels -->
  <text x="510" y="530" class="tiny">El audio se reproduce en el cliente:</text>
  <text x="510" y="546" class="tiny">no depende del altavoz de la placa.</text>
  <text x="510" y="572" class="tiny">Si Piper falla, la alerta igual se publica</text>
  <text x="510" y="588" class="tiny">con audio_generated=false.</text>
</svg>
