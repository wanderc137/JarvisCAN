<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" role="img" aria-labelledby="title desc">
  <title id="title">Rendimiento medido de JarvisCAN en Arduino UNO Q</title>
  <desc id="desc">Gráfico de barras con tiempos de pared y duración de audio para perfiles de Piper y una consulta completa en frío.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="audio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <style>
      .title{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f8fafc}
      .sub{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .lbl{font:600 12.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#e2e8f0}
      .small{font:400 11px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .tiny{font:500 10px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#64748b}
      .axis{font:500 10px ui-monospace,Menlo,monospace;fill:#64748b}
      .val{font:700 11px ui-monospace,Menlo,monospace;fill:#e2e8f0}
      .cyan{font:700 11px system-ui,sans-serif;fill:#22d3ee;letter-spacing:.08em}
    </style>
  </defs>

  <rect width="1160" height="800" fill="url(#bg)"/>
  <text x="48" y="56" class="title">Rendimiento medido · UNO Q (CPU-only)</text>
  <text x="48" y="80" class="sub">4×Cortex-A53 · mediciones puntuales de la documentación, no un benchmark sistemático</text>

  <!-- Legend -->
  <rect x="48" y="104" width="14" height="14" rx="3" fill="url(#wall)"/>
  <text x="70" y="116" class="small">tiempo de pared (s)</text>
  <rect x="210" y="104" width="14" height="14" rx="3" fill="url(#audio)"/>
  <text x="232" y="116" class="small">duración del audio (s)</text>

  <!-- Highlight chosen profile -->
  <rect x="36" y="283" width="1092" height="70" rx="10" fill="#0e7490" opacity="0.10"/>
  <text x="1088" y="300" class="tiny" text-anchor="end">perfil elegido</text>

  <!-- Grid and axis -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="330" y1="150" x2="330" y2="650"/>
    <line x1="476" y1="150" x2="476" y2="650"/>
    <line x1="622" y1="150" x2="622" y2="650"/>
    <line x1="768" y1="150" x2="768" y2="650"/>
    <line x1="914" y1="150" x2="914" y2="650"/>
    <line x1="1060" y1="150" x2="1060" y2="650"/>
  </g>
  <g class="axis" text-anchor="middle">
    <text x="330" y="670">0</text>
    <text x="476" y="670">10</text>
    <text x="622" y="670">20</text>
    <text x="768" y="670">30</text>
    <text x="914" y="670">40</text>
    <text x="1060" y="670">50 s</text>
  </g>

  <!-- Rows: label, wall bar, audio bar, values -->
  <g>
    <text x="48" y="166" class="lbl">Piper MX flat</text>
    <rect x="330" y="154" width="128" height="14" rx="3" fill="url(#wall)"/>
    <text x="466" y="166" class="val">8,76</text>
    <rect x="330" y="172" width="117" height="8" rx="3" fill="url(#audio)"/>
    <text x="455" y="180" class="tiny">7,99</text>
  </g>

  <g>
    <text x="48" y="224" class="lbl">Piper MX human</text>
    <rect x="330" y="212" width="197" height="14" rx="3" fill="url(#wall)"/>
    <text x="535" y="224" class="val">13,47</text>
    <rect x="330" y="230" width="114" height="8" rx="3" fill="url(#audio)"/>
    <text x="452" y="238" class="tiny">7,84</text>
  </g>

  <g>
    <text x="48" y="306" class="lbl">Piper MX human-lite</text>
    <rect x="330" y="294" width="130" height="14" rx="3" fill="url(#wall)"/>
    <text x="468" y="306" class="val">8,93</text>
    <rect x="330" y="312" width="120" height="8" rx="3" fill="url(#audio)"/>
    <text x="458" y="320" class="tiny">8,20</text>
  </g>

  <g>
    <text x="48" y="364" class="lbl">Piper human-lite · 2.ª</text>
    <rect x="330" y="352" width="122" height="14" rx="3" fill="url(#wall)"/>
    <text x="460" y="364" class="val">8,38</text>
    <rect x="330" y="370" width="122" height="8" rx="3" fill="url(#audio)"/>
    <text x="460" y="378" class="tiny">8,37</text>
  </g>

  <g>
    <text x="48" y="422" class="lbl">Piper davefx flat</text>
    <rect x="330" y="410" width="80" height="14" rx="3" fill="url(#wall)"/>
    <text x="418" y="422" class="val">5,46</text>
    <rect x="330" y="428" width="103" height="8" rx="3" fill="url(#audio)"/>
    <text x="441" y="436" class="tiny">7,07</text>
  </g>

  <g>
    <text x="48" y="480" class="lbl">Piper daniela human</text>
    <rect x="330" y="468" width="547" height="14" rx="3" fill="url(#wall)"/>
    <text x="885" y="480" class="val">37,50</text>
    <rect x="330" y="486" width="87" height="8" rx="3" fill="url(#audio)"/>
    <text x="425" y="494" class="tiny">5,97</text>
  </g>

  <g>
    <text x="48" y="538" class="lbl">TTS test final</text>
    <rect x="330" y="526" width="134" height="14" rx="3" fill="url(#wall)"/>
    <text x="472" y="538" class="val">9,20</text>
    <rect x="330" y="544" width="122" height="8" rx="3" fill="url(#audio)"/>
    <text x="460" y="552" class="tiny">8,39</text>
  </g>

  <g>
    <text x="48" y="596" class="lbl">Consulta completa en frío</text>
    <text x="48" y="612" class="tiny">incluye carga inicial del LLM</text>
    <rect x="330" y="584" width="667" height="14" rx="3" fill="url(#wall)"/>
    <text x="1005" y="596" class="val">45,65</text>
    <rect x="330" y="602" width="112" height="8" rx="3" fill="url(#audio)"/>
    <text x="450" y="610" class="tiny">7,66</text>
  </g>

  <!-- Notes -->
  <rect x="48" y="700" width="1064" height="66" rx="12" fill="#0b1220" stroke="#1e293b"/>
  <text x="68" y="724" class="cyan">LECTURA</text>
  <text x="68" y="744" class="small">Piper domina la latencia de una alerta; el panel no espera al audio. La consulta en frío incluye la primera carga del modelo.</text>
  <text x="68" y="760" class="tiny">Fuente: mediciones de docs/VOICE-HUMAN-LITE.md y docs/VOICE.md · hardware: Arduino UNO Q.</text>
</svg>
