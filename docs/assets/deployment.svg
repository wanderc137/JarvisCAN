<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Despliegue de JarvisCAN en Arduino UNO Q</title>
  <desc id="desc">Servicios systemd, puertos, almacenamiento local, router OpenWrt de demo, navegador LAN, micrófono IP Webcam y salida Bluetooth.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a2b"/><stop offset="1" stop-color="#0a1422"/>
    </linearGradient>
    <style>
      .title{font:700 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f8fafc}
      .sub{font:400 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .lbl{font:600 13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#e2e8f0}
      .small{font:400 11.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#94a3b8}
      .tiny{font:500 10.5px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#64748b}
      .cyan{font:700 11px system-ui,sans-serif;fill:#22d3ee;letter-spacing:.08em}
      .mono{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}
      .port{font:700 10px ui-monospace,Menlo,monospace;fill:#04121f}
    </style>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <text x="56" y="64" class="title">Despliegue · UNO Q + systemd + LAN de demo</text>
  <text x="56" y="88" class="sub">Tres servicios activos, un logger preparado y publicación del panel por DNAT</text>

  <!-- Board -->
  <rect x="48" y="122" width="540" height="620" rx="20" fill="url(#board)" stroke="#1f6f8b" stroke-width="2"/>
  <rect x="66" y="140" width="504" height="54" rx="10" fill="#0b2233" stroke="#164e63"/>
  <text x="82" y="163" class="cyan">ARDUINO UNO Q · 192.168.10.75</text>
  <text x="82" y="182" class="small">Debian 13 · QRB2210 aarch64 · 4 núcleos · 3,6 GiB</text>

  <!-- Services -->
  <rect x="66" y="212" width="240" height="96" rx="12" fill="#101d31" stroke="#2b4a6f"/>
  <circle cx="84" cy="232" r="5" fill="#34d399"/>
  <text x="98" y="236" class="mono">jarvis-can-sim</text>
  <text x="82" y="258" class="small">simulate_can.py</text>
  <text x="82" y="276" class="small">1 muestra / 60 s</text>
  <text x="82" y="294" class="tiny">Restart=always · sin puerto</text>

  <rect x="318" y="212" width="252" height="96" rx="12" fill="#101d31" stroke="#2b4a6f"/>
  <circle cx="336" cy="232" r="5" fill="#34d399"/>
  <text x="350" y="236" class="mono">jarvis-can-alerts</text>
  <text x="334" y="258" class="small">can_alerts.py</text>
  <text x="334" y="276" class="small">6 reglas · 3 min</text>
  <text x="334" y="294" class="tiny">WAV + JSONL · sin puerto</text>

  <rect x="66" y="324" width="240" height="96" rx="12" fill="#101d31" stroke="#2b4a6f"/>
  <circle cx="84" cy="344" r="5" fill="#34d399"/>
  <text x="98" y="348" class="mono">jarvis-can-tts</text>
  <text x="82" y="370" class="small">tts-server.py</text>
  <text x="82" y="388" class="small">panel + API + WAV</text>
  <text x="82" y="406" class="tiny">0.0.0.0:8090</text>
  <rect x="226" y="332" width="72" height="20" rx="10" fill="#22d3ee"/>
  <text x="238" y="346" class="port">:8090</text>

  <rect x="318" y="324" width="252" height="96" rx="12" fill="#0c1728" stroke="#475569" stroke-dasharray="5 4"/>
  <circle cx="336" cy="344" r="5" fill="#fbbf24"/>
  <text x="350" y="348" class="mono">jarvis-can-logger</text>
  <text x="334" y="370" class="small">bin/can_logger --iface can0</text>
  <text x="334" y="388" class="small">preparado · requiere CAN real</text>
  <text x="334" y="406" class="tiny">no arranca sin interfaz can0</text>

  <!-- Ollama -->
  <rect x="66" y="436" width="240" height="74" rx="12" fill="#101d31" stroke="#2b4a6f"/>
  <text x="82" y="460" class="mono">ollama</text>
  <text x="82" y="480" class="small">qwen2.5:0.5b-instruct</text>
  <text x="82" y="498" class="tiny">127.0.0.1:11434 · solo local</text>

  <!-- Storage -->
  <rect x="318" y="436" width="252" height="74" rx="12" fill="#0e2a33" stroke="#0e7490"/>
  <text x="334" y="460" class="mono">data/</text>
  <text x="334" y="480" class="small">vehicle.db · alerts.jsonl</text>
  <text x="334" y="498" class="tiny">alert_audio/ · last_answer.wav</text>

  <!-- Pending hardware -->
  <rect x="66" y="530" width="504" height="88" rx="12" fill="#0a1220" stroke="#334155"/>
  <text x="82" y="554" class="cyan">PENDIENTE DE HARDWARE</text>
  <text x="82" y="576" class="small">USB-CAN (SocketCAN) o transceptor 3,3 V SN65HVD230 / TJA1051 + firmware Zephyr</text>
  <text x="82" y="596" class="tiny">D4 = FDCAN1_TX · D5 = FDCAN1_RX · nunca conectar al bus sin transceptor</text>

  <!-- Board footer -->
  <text x="82" y="656" class="tiny">Despliegue: ./scripts/deploy-unoq.sh · SSH :22 · usuario arduino</text>
  <text x="82" y="678" class="tiny">Instalación: install-all-services.sh + install-service.sh (logger + sudoers)</text>
  <text x="82" y="708" class="tiny">Logs: journalctl -u jarvis-can-sim|alerts|tts -f</text>

  <!-- Router -->
  <rect x="700" y="170" width="220" height="164" rx="16" fill="#111a2e" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="718" y="196" class="cyan">ROUTER DEMO</text>
  <text x="718" y="220" class="lbl">OpenWrt · 192.168.10.1</text>
  <text x="718" y="242" class="small">DNAT tcp/8090 → placa:8090</text>
  <text x="718" y="260" class="small">Hairpin SNAT para la LAN</text>
  <text x="718" y="284" class="small">Publica el panel, no la API de Ollama</text>
  <rect x="718" y="298" width="120" height="20" rx="10" fill="#a78bfa"/>
  <text x="730" y="312" class="port">DNAT 8090</text>

  <!-- Browser -->
  <rect x="1000" y="170" width="210" height="164" rx="16" fill="#111a2e" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="1018" y="196" class="cyan">CLIENTE LAN</text>
  <text x="1018" y="222" class="lbl">Navegador</text>
  <text x="1018" y="244" class="small">http://192.168.10.1:8090/</text>
  <text x="1018" y="262" class="small">http://192.168.10.75:8090/</text>
  <text x="1018" y="286" class="small">Panel · feed · audio</text>
  <text x="1018" y="308" class="tiny">Sin auth ni TLS (solo demo)</text>

  <!-- Phone -->
  <rect x="700" y="420" width="220" height="120" rx="14" fill="#111a2e" stroke="#334155"/>
  <text x="718" y="446" class="cyan">MICRÓFONO OPCIONAL</text>
  <text x="718" y="470" class="lbl">IP Webcam (Android)</text>
  <text x="718" y="492" class="small">IP Webcam :8080/audio.wav</text>
  <text x="718" y="510" class="small">WAV 44,1 kHz → 16 kHz</text>
  <text x="718" y="528" class="tiny">Vosk opcional; no esencial</text>

  <!-- Bluetooth -->
  <rect x="1000" y="420" width="210" height="120" rx="14" fill="#111a2e" stroke="#334155"/>
  <text x="1018" y="446" class="cyan">SALIDA OPCIONAL</text>
  <text x="1018" y="470" class="lbl">EW02 Plus · A2DP</text>
  <text x="1018" y="492" class="small">pw-cat sobre PipeWire</text>
  <text x="1018" y="510" class="small">Sesión de lightdm</text>
  <text x="1018" y="528" class="tiny">Micrófono: silencio</text>

  <!-- SSH -->
  <rect x="700" y="580" width="220" height="120" rx="14" fill="#111a2e" stroke="#334155"/>
  <text x="718" y="606" class="cyan">ADMINISTRACIÓN</text>
  <text x="718" y="630" class="lbl">SSH :22</text>
  <text x="718" y="652" class="small">ssh arduino@192.168.10.75</text>
  <text x="718" y="670" class="small">deploy-unoq.sh · start/stop/status</text>
  <text x="718" y="690" class="tiny">Clave ~/.ssh/unoq_key</text>

  <!-- Notes -->
  <rect x="1000" y="580" width="210" height="120" rx="14" fill="#0a1220" stroke="#1e293b"/>
  <text x="1018" y="606" class="cyan">SIN NUBE</text>
  <text x="1018" y="630" class="small">SQLite, Piper y Ollama locales</text>
  <text x="1018" y="650" class="small">Sin telemetría ni cuentas</text>
  <text x="1018" y="670" class="small">Base y audios en la placa</text>
  <text x="1018" y="690" class="tiny">Reloj sin NTP</text>

  <!-- Arrows -->
  <path d="M606 372 L696 320" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="618" y="352" class="tiny">HTTP 8090</text>

  <path d="M920 300 L996 280" fill="none" stroke="#7dd3fc" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="930" y="288" class="tiny">LAN</text>

  <path d="M700 470 C660 470 620 470 590 470" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arDim)"/>
  <text x="608" y="460" class="tiny">audio crudo</text>

  <path d="M700 640 C660 640 620 640 590 640" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arDim)"/>
  <text x="616" y="630" class="tiny">deploy</text>
</svg>
